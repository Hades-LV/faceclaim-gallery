name: Deduplicate Faceclaim Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run deduplication script
        run: python dedupe_data.py

      - name: Commit and push cleaned data and images
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data.json images/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Remove duplicate faceclaim images"
            git pull --rebase origin main
            git push
          fi
