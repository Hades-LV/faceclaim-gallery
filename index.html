<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faceclaim Gallery</title>
  <style>
    :root {
      --bg: #121216;
      --card: #1e1e26;
      --accent: #5865F2;
      --text: #f0f0f5;
      --muted: #9a9aa8;
      --border: #2e2e3a;
      --card-min: 180px;
      --img-fit: cover;
    }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; min-height: 100vh; }
    aside { width: 280px; background: var(--card); border-right: 1px solid var(--border); padding: 20px; flex-shrink: 0; box-sizing: border-box; }
    main { flex: 1; padding: 24px; min-width: 0; }
    h1, h2, h3 { margin-top: 0; }
    input[type="text"], select { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; margin-bottom: 12px; box-sizing: border-box; }
    .display-bar select, .display-bar button { width: auto; margin-bottom: 0; }
    button { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    button.secondary { background: #2e2e3a; }
    button.danger { background: #d83c3e; padding: 4px 8px; font-size: 11px; }
    .cat-block { margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .cat-title { font-weight: 700; font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .tag-chip { display: inline-block; padding: 4px 10px; margin: 3px; border-radius: 20px; font-size: 12px; background: var(--bg); border: 1px solid var(--border); cursor: pointer; user-select: none; }
    .tag-chip.active { background: var(--accent); border-color: var(--accent); color: white; }

    /* Default Responsive Gallery Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr)); gap: 18px; }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .grid.cols-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }

    /* 1-per-row Scrollable List Mode */
    .grid.list-view {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .grid.list-view .card {
      flex-direction: row;
      align-items: center;
      padding: 8px 12px;
      gap: 14px;
    }
    .grid.list-view .card > a:first-child {
      flex-shrink: 0;
      width: 64px;
    }
    .grid.list-view .card img {
      width: 64px;
      height: 64px;
      border-radius: 6px;
    }
    .grid.list-view .card-body {
      padding: 0;
      flex: 1;
      min-width: 0;
    }
    .grid.list-view .card-title {
      margin-bottom: 4px;
    }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: transform 0.15s; display: flex; flex-direction: column; min-width: 0; }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card a { text-decoration: none; color: inherit; display: block; }
    .card img { width: 100%; aspect-ratio: 1 / 1; object-fit: var(--img-fit); background: #0b0b0e; display: block; }
    .card-body { padding: 10px; }
    .card-title { font-weight: 600; font-size: 15px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .hide-card-tags .card-tags { display: none; }
    .mini-tag { font-size: 10px; background: #2b2b36; padding: 2px 6px; border-radius: 4px; color: var(--muted); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
    .toolbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .display-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; }
    .display-control { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .edit-panel { background: #252530; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--accent); }
    .hidden { display: none; }

    /* Mobile-only elements hidden on desktop */
    .mobile-only { display: none; }
    .drawer-backdrop { display: none; }
    .drawer-header { display: none; }
    .mobile-search-wrap { display: none; }
    .mobile-display-toggle { display: none; }

    /* Floating Cursor Hover Preview */
    #hoverPreview {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      display: none;
      background: var(--card);
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
    }
    #hoverPreview img {
      display: block;
      max-width: 420px;
      max-height: 75vh;
      width: auto;
      height: auto;
      border-radius: 6px;
    }

    /* =========================================================
       MOBILE INTERFACE (<= 768px) — PC layout above is untouched
       ========================================================= */
    @media (max-width: 768px) {
      body {
        display: block;
        min-height: 100dvh;
        overflow-x: hidden;
      }

      body.drawer-open {
        overflow: hidden;
      }

      .mobile-only {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .drawer-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 1050;
      }

      .drawer-backdrop.open {
        display: block;
      }

      /* Slide-over Filters Drawer */
      aside {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(86vw, 330px);
        max-width: 100%;
        z-index: 1100;
        border-right: 1px solid var(--border);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        padding: 16px;
      }

      aside.open {
        transform: translateX(0);
      }

      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }

      .drawer-header h2 {
        margin: 0;
        font-size: 18px;
      }

      aside > h2 {
        display: none;
      }

      .filter-badge {
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 999px;
      }

      .tag-chip {
        padding: 7px 12px;
        margin: 4px 4px 4px 0;
        font-size: 13px;
      }

      main {
        padding: 12px;
        width: 100%;
        box-sizing: border-box;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 900;
        background: rgba(18, 18, 22, 0.95);
        backdrop-filter: blur(8px);
        padding: 8px 4px;
        margin: -4px -4px 10px -4px;
        border-bottom: 1px solid var(--border);
        gap: 8px;
      }

      .toolbar h1 {
        font-size: 18px !important;
        line-height: 1.2;
      }

      .toolbar h1 span {
        font-size: 13px !important;
      }

      .toolbar-actions {
        gap: 6px;
      }

      .toolbar button {
        padding: 7px 10px;
        font-size: 12px;
      }

      /* Dedicated mobile search bar right under header */
      .mobile-search-wrap {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }

      .mobile-search-wrap input[type="text"] {
        margin-bottom: 0;
        font-size: 15px; /* prevents iOS Safari zoom on focus */
        padding: 9px 12px;
      }

      .mobile-display-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        margin-bottom: 10px;
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 9px 12px;
        font-size: 13px;
      }

      /* Display bar collapsed by default on mobile; expands when toggled */
      .display-bar {
        display: none;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 12px;
        margin-bottom: 14px;
      }

      .display-bar.mobile-expanded {
        display: grid;
      }

      .display-bar > span {
        display: none;
      }

      .display-control {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        font-size: 12px;
      }

      .display-bar select {
        width: 100%;
        font-size: 14px;
        padding: 7px 8px;
        margin-bottom: 0;
      }

      .display-bar #toggleTagsBtn {
        grid-column: 1 / -1;
        width: 100%;
        padding: 8px 10px;
      }

      .edit-panel {
        font-size: 12px;
        padding: 10px 12px;
        margin-bottom: 12px;
      }

      /* Default to 2 columns on mobile for comfortable browsing */
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 10px;
      }

      .grid.cols-1 {
        grid-template-columns: minmax(0, 1fr) !important;
      }

        display: flex !important;
        flex-direction: column;
        gap:
